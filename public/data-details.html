<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验分析数据明细</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f3f4f6; }
        .table-container { 
            max-width: 1200px; 
            margin: 40px auto; 
            background: white; 
            padding: 40px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
            border-radius: 16px; 
        }
        th { background-color: #f8fafc; font-weight: 600; color: #475569; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
        td { color: #1f2937; font-size: 0.875rem; }
        tr:hover { background-color: #f1f5f9; }
        .group-a { color: #2563eb; background-color: #eff6ff; padding: 2px 8px; border-radius: 9999px; font-weight: 500; }
        .group-b { color: #059669; background-color: #ecfdf5; padding: 2px 8px; border-radius: 9999px; font-weight: 500; }
        .growth-positive { color: #059669; font-weight: 600; }
        .growth-zero { color: #64748b; }
        .growth-negative { color: #dc2626; font-weight: 600; }
        
        .nav-btn { transition: all 0.2s; }
        .nav-btn:hover { background-color: #f3f4f6; transform: translateX(-4px); }
    </style>
</head>
<body>
    <div class="table-container">
        <div class="flex justify-between items-center mb-6 border-b border-gray-200 pb-4">
            <div>
                <a href="/" class="nav-btn text-gray-500 hover:text-gray-900 text-sm font-medium flex items-center py-2 px-3 rounded-lg border border-transparent hover:border-gray-200 w-max mb-4">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    返回系统首页
                </a>
                <h1 class="text-2xl font-bold text-gray-900">📄 实验分析最新数据明细</h1>
                <p class="text-gray-500 mt-1 text-sm">展示所有已完成前后测的受试者数据（按最新完成时间排序）</p>
            </div>
            <div class="flex space-x-3">
                <a href="/analysis.html" class="px-4 py-2 bg-blue-50 text-blue-600 rounded-lg text-sm font-medium hover:bg-blue-100 transition-colors flex items-center border border-blue-200">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    查看统计图表
                </a>
                <a href="/api/export-data" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors flex items-center border border-gray-300 shadow-sm">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    导出 CSV
                </a>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 border border-gray-200 rounded-lg overflow-hidden">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left whitespace-nowrap">ID</th>
                        <th scope="col" class="px-6 py-3 text-left whitespace-nowrap">学号/昵称</th>
                        <th scope="col" class="px-6 py-3 text-left whitespace-nowrap">组别</th>
                        <th scope="col" class="px-6 py-3 text-center border-l border-gray-200 whitespace-nowrap">前测节点</th>
                        <th scope="col" class="px-6 py-3 text-center whitespace-nowrap">后测节点</th>
                        <th scope="col" class="px-6 py-3 text-center bg-blue-50/50 whitespace-nowrap">节点增量</th>
                        <th scope="col" class="px-6 py-3 text-center border-l border-gray-200 whitespace-nowrap">前测关系</th>
                        <th scope="col" class="px-6 py-3 text-center whitespace-nowrap">后测关系</th>
                        <th scope="col" class="px-6 py-3 text-center bg-green-50/50 whitespace-nowrap">关系增量</th>
                    </tr>
                </thead>
                <tbody id="data-table-body" class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td colspan="9" class="px-6 py-8 text-center text-gray-500">
                            <div class="flex justify-center items-center">
                                <svg class="animate-spin h-5 w-5 mr-3 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                正在加载数据...
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadDataDetails() {
            try {
                const response = await fetch('/api/data-details');
                const data = await response.json();
                
                const tbody = document.getElementById('data-table-body');
                tbody.innerHTML = ''; // 清空加载提示
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-8 text-center text-gray-500">暂无已完成前后测的受试者数据。</td></tr>';
                    return;
                }

                const getGrowthClass = (val) => {
                    if (val > 0) return 'growth-positive';
                    if (val < 0) return 'growth-negative';
                    return 'growth-zero';
                };

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    const groupClass = row.group_type === 'A' ? 'group-a' : 'group-b';
                    const groupText = row.group_type === 'A' ? 'A (控制组)' : 'B (高可解释性)';

                    const nodeGrowthPrefix = row.node_growth > 0 ? '+' : '';
                    const edgeGrowthPrefix = row.edge_growth > 0 ? '+' : '';

                    tr.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap text-gray-500">${row.user_id}</td>
                        <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">${row.username}</td>
                        <td class="px-6 py-4 whitespace-nowrap"><span class="${groupClass}">${groupText}</span></td>
                        
                        <td class="px-6 py-4 whitespace-nowrap text-center border-l border-gray-100">${row.pre_node_count}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">${row.post_node_count}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center bg-blue-50/20"><span class="${getGrowthClass(row.node_growth)}">${nodeGrowthPrefix}${row.node_growth}</span></td>
                        
                        <td class="px-6 py-4 whitespace-nowrap text-center border-l border-gray-100">${row.pre_edge_count}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center">${row.post_edge_count}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center bg-green-50/20"><span class="${getGrowthClass(row.edge_growth)}">${edgeGrowthPrefix}${row.edge_growth}</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('获取数据明细失败:', error);
                document.getElementById('data-table-body').innerHTML = '<tr><td colspan="9" class="px-6 py-8 text-center text-red-500">获取数据失败，请确保后台服务正常运行。</td></tr>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadDataDetails);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 辅助学习实验平台 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full border border-gray-200">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-graduation-cap text-blue-600 text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">欢迎参加学习实验</h1>
            <p class="text-gray-500 mt-2 text-sm">请输入您的学号或昵称以进入系统。系统将自动为您分配学习模式。</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">学号 / 昵称</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="username" required class="pl-10 w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="如：20230001">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:ring-4 focus:ring-blue-200 transition-all flex justify-center items-center">
                <span>进入实验</span>
                <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>

        <div id="loadingMsg" class="hidden text-center text-blue-600 mt-4 text-sm font-medium">
            <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> 正在分配实验组别并加载数据...
        </div>

        <!-- 隐藏的管理员入口 -->
         <div class="mt-8 pt-4 border-t border-gray-100 text-center space-y-3">
             <div>
                 <a href="/analysis.html" class="text-sm text-blue-600 hover:text-blue-800 transition-colors font-medium flex items-center justify-center">
                     <i class="fa-solid fa-chart-bar mr-2"></i>查看实时实验分析报告网页
                 </a>
             </div>
             <div class="flex justify-center space-x-4">
                 <a href="/data-details.html" class="text-xs text-green-600 hover:text-green-800 transition-colors flex items-center font-medium">
                     <i class="fa-solid fa-table mr-1"></i>查看实验分析数据明细
                 </a>
                 <span class="text-gray-300">|</span>
                 <a href="/api/export" class="text-xs text-gray-500 hover:text-gray-800 transition-colors flex items-center">
                     <i class="fa-solid fa-download mr-1"></i>导出实验分析数据 (CSV)
                 </a>
             </div>
         </div>
     </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            if (!username) return;

            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('loadingMsg').classList.remove('hidden');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert('登录失败: ' + data.error);
                } else {
                    // 将用户信息存入 localStorage
                    localStorage.setItem('user', JSON.stringify(data));
                    // 获取用户当前的实验状态 (检查是否完成了前测/后测)
                    const statusRes = await fetch(`/api/user-status/${data.id}`);
                    const statusData = await statusRes.json();
                    
                    if (!statusData.preDone) {
                        // 未完成前测 -> 跳往概念图前测页面
                        window.location.href = '/concept-map.html?stage=pre';
                    } else if (!statusData.postDone) {
                        // 已完成前测，未完成后测 -> 跳往学习对话页面
                        window.location.href = '/chat.html';
                    } else {
                        // 都已完成 -> 感谢页面
                        window.location.href = '/thank-you.html';
                    }
                }
            } catch (error) {
                alert('网络请求失败，请检查服务是否启动。');
                console.error(error);
            } finally {
                document.getElementById('submitBtn').classList.remove('hidden');
                document.getElementById('loadingMsg').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
